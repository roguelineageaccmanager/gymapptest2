name: Deploy optional chat notifications
on:
  workflow_dispatch:
  push:
    branches: [codex/v4-0-1]
    paths: ['.github/workflows/chat-push.yml']
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Deploy checked notification-only sender and access rules
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHAT_PUSH_WEBHOOK_KEY: ${{ secrets.CHAT_PUSH_WEBHOOK_KEY }}
        run: node tools/deploy-chat-push.mjs
