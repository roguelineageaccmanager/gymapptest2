name: Deploy timed-set totals
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261106195354_timed_sets_volume.sql'
      - 'tools/deploy-timed-sets.mjs'
      - 'tools/check-timed-sets.sql'
      - '.github/workflows/timed-sets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply fixed migration with synthetic totals checks and access guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node tools/deploy-timed-sets.mjs
