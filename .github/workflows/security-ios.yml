name: Audit and harden web notifications
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the checked security migration and existing sender update
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  security:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Run the fixed allowlisted audit or checked update
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CHAT_PUSH_WEBHOOK_KEY: ${{ secrets.CHAT_PUSH_WEBHOOK_KEY }}
          APPLY_SECURITY_UPDATE: ${{ inputs.apply }}
        run: node tools/security-ios.mjs
